version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ai_postgres

    environment:
      POSTGRES_DB: ai_documents
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: ai_redis

    ports:
      - "6379:6379"



  backend:

    build:
      context: ./backend

    container_name: ai_backend

    command:
      python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"


    environment:

      DATABASE_NAME: ai_documents
      DATABASE_USER: admin
      DATABASE_PASSWORD: password
      DATABASE_HOST: postgres

      REDIS_HOST: redis


    depends_on:
      - postgres
      - redis



  celery:

    build:
      context: ./backend


    command:

      celery -A config worker --loglevel=info


    volumes:
      - ./backend:/app


    environment:

      REDIS_HOST: redis


    depends_on:
      - redis



volumes:

  postgres_data: