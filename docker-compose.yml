services:

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: document_platform
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U document_user -d document_platform"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .

    command:
      >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      USE_POSTGRES: "True"

    volumes:
      - .:/app
      - media_data:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .

    command:
      celery -A config worker --loglevel=info

    env_file:
      - .env

    environment:
      USE_POSTGRES: "True"

    volumes:
      - .:/app
      - media_data:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data: